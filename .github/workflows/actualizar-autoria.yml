name: Actualizar autoria editorial

on:
  push:
    branches:
      - autoria-gonzalez-ornelas-2026

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autoria-gonzalez-ornelas-2026
          fetch-depth: 0

      - name: Actualizar autoria y validar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Isaac González Granados'
          new='Isaac González Granados y Olinda Ornelas Benítez'
          count=s.count(old)
          if count < 2:
              raise SystemExit(f'Se esperaban al menos 2 apariciones de autoría, encontradas: {count}')
          s=s.replace(old,new)
          meta='<meta name="author" content="Isaac González Granados y Olinda Ornelas Benítez" />'
          if 'name="author"' not in s:
              marker='<meta name="theme-color" content="#071426" />'
              s=s.replace(marker, marker+'\n    '+meta, 1)
          assert new in s
          assert old not in s.replace(new,'')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'Isaac González Granados y Olinda Ornelas Benítez' index.html
          grep -Fq 'name="author" content="Isaac González Granados y Olinda Ornelas Benítez"' index.html

      - name: Guardar cambio
        run: |
          rm .github/workflows/actualizar-autoria.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/actualizar-autoria.yml
          git commit -m 'chore: actualizar autoria del libro digital'
          git push origin HEAD:autoria-gonzalez-ornelas-2026
