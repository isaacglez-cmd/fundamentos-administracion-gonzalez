name: Actualizar autoria editorial

on:
  push:
    branches:
      - autoria-gonzalez-ornelas-2026

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autoria-gonzalez-ornelas-2026
          fetch-depth: 0

      - name: Actualizar autoria y validar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='Isaac González Granados y Olinda Ornelas Benítez'
          s=s.replace('Isaac González Granados', new)
          s=re.sub(r'Isaac\s+González Granados', new, s)
          meta='<meta name="author" content="Isaac González Granados y Olinda Ornelas Benítez" />'
          if 'name="author"' not in s:
              marker='<meta name="theme-color" content="#071426" />'
              s=s.replace(marker, marker+'\n    '+meta, 1)
          if s.count(new) < 2:
              raise SystemExit(f'Autoría actualizada en menos lugares de los esperados: {s.count(new)}')
          if 'name="author" content="Isaac González Granados y Olinda Ornelas Benítez"' not in s:
              raise SystemExit('Falta metadato de autoría')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'Isaac González Granados y Olinda Ornelas Benítez' index.html

      - name: Guardar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: actualizar autoria del libro digital'
          git push origin HEAD:autoria-gonzalez-ornelas-2026
