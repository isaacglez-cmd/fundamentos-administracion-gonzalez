name: Cierre editorial final

on:
  push:
    branches:
      - cierre-editorial-final-2026

permissions:
  contents: write

jobs:
  corregir-y-validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cierre-editorial-final-2026
          fetch-depth: 0

      - name: Corregir residuos editoriales
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "aria-label='Figura 4.1 · Niveles de la planeación.'": "aria-label='Figura 4.1 · Criterios SMART de un objetivo.'",
              "<figcaption>Figura 4.1 · Niveles de la planeación.</figcaption>": "<figcaption>Figura 4.1 · Criterios SMART de un objetivo.</figcaption>",
              "aria-label='Figura 8.1 · El proceso de comunicación.'": "aria-label='Figura 8.1 · Etapas de desarrollo de un equipo según Tuckman.'",
              "<figcaption>Figura 8.1 · El proceso de comunicación.</figcaption>": "<figcaption>Figura 8.1 · Etapas de desarrollo de un equipo según Tuckman.</figcaption>",
              "<h4>7.1 Liderazgo vs. administración</h4>": "<h3>7.1 Liderazgo vs. administración</h3>",
              "<p>sobre el desempeño, más allá de las condiciones físicas.</p>": "",
              "<p>organización</p>": "",
              "<p>tiempo disponibles</p>": "",
              "<p>proyecto simultáneamente</p>": "",
              "<p>responsabilidad compartida</p>": "",
              "<p>estratégicos</p>": "",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'No se encontró patrón esperado: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar integridad completa
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          for bad in [
              '<p>sobre el desempeño, más allá de las condiciones físicas.</p>',
              '<p>organización</p>',
              '<p>tiempo disponibles</p>',
              '<p>proyecto simultáneamente</p>',
              '<p>responsabilidad compartida</p>',
              '<p>estratégicos</p>',
              'Figura 4.1 · Niveles de la planeación.',
              'Figura 8.1 · El proceso de comunicación.',
              '<h4>7.1 Liderazgo vs. administración</h4>',
          ]:
              assert bad not in s, bad
          assert 'Figura 4.1 · Criterios SMART de un objetivo.' in s
          assert 'Figura 8.1 · Etapas de desarrollo de un equipo según Tuckman.' in s
          assert '<h3>7.1 Liderazgo vs. administración</h3>' in s
          assert all(f"id='cap{i}'" in s for i in range(1,11))
          assert all(f'id="cuaderno-cap{i}"' in s for i in range(1,11))
          assert 'id="integradoras"' in s
          q = re.search(r'<script id="quizData" type="application/json">(.*?)</script>', s, re.S)
          f = re.search(r'<script id="flashData" type="application/json">(.*?)</script>', s, re.S)
          assert len(json.loads(q.group(1))) == 30
          assert len(json.loads(f.group(1))) == 10
          assert 'url:location.href' in s
          assert "navigator.serviceWorker.register('./sw.js')" in s
          assert "localStorage.setItem('fadm_'" in s
          assert '"display": "standalone"' in Path('manifest.webmanifest').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert './manifest.webmanifest' in sw and './icon-192.png' in sw and './icon-512.png' in sw
          print('OK: 10 capítulos, 30 quizzes, 10 flashcards, PWA e integridad editorial validadas')
          PY

      - name: Confirmar archivos binarios
        run: |
          file icon-192.png | grep -Fq 'PNG image data'
          file icon-512.png | grep -Fq 'PNG image data'

      - name: Guardar correcciones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'fix: cerrar residuos editoriales del libro digital'
          git push origin HEAD:cierre-editorial-final-2026
