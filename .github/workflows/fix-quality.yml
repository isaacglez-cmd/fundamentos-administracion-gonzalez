name: Cierre de calidad 2026

on:
  push:
    branches:
      - cierre-calidad-2026

permissions:
  contents: write

jobs:
  fix-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cierre-calidad-2026
      - name: Corregir hallazgos de revisión
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "href='https://www.economia.unam.mx/ (buscar en el repositorio institucional de acceso abierto)'": "href='https://www.economia.unam.mx/'",
              "href='https://www.rebiun.org/ (buscar repositorios de acceso abierto en administración)'": "href='https://www.rebiun.org/'",
              "href='https://www.gob.mx/se (sección de estadísticas de Inversión Extranjera Directa)'": "href='https://www.gob.mx/se'",
              "Example: &quot;The contingency approach argues that the best management style depends on the</span></div><p>situation.&quot;</p>": "Example: &quot;The contingency approach argues that the best management style depends on the situation.&quot;</span></div>",
              'Example: \\"The contingency approach argues that the best management style depends on the"},': 'Example: \\"The contingency approach argues that the best management style depends on the situation.\\"},',
              "let data={title:'Fundamentos de la Administración · UACH',text:'Edición digital interactiva de Fundamentos de la Administración'};": "let data={title:'Fundamentos de la Administración · UACH',text:'Edición digital interactiva de Fundamentos de la Administración',url:location.href};",
          }
          missing=[]
          for old,new in replacements.items():
              if old not in s:
                  missing.append(old)
              else:
                  s=s.replace(old,new)
          if missing:
              raise SystemExit('No se encontraron patrones esperados: '+repr(missing))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar correcciones
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "href='https://www.economia.unam.mx/ (" not in s
          assert "href='https://www.rebiun.org/ (" not in s
          assert "href='https://www.gob.mx/se (" not in s
          assert "url:location.href" in s
          assert "depends on the situation" in s
          print('Validación OK')
          PY
      - name: Commit de cierre
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-quality.yml
          git add -- index.html
          git commit -m "fix: cerrar hallazgos de revisión del PWA"
          git push origin HEAD:cierre-calidad-2026
