name: Corregir maquetacion movil y casos

on:
  push:
    branches:
      - correccion-movil-casos-2026

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correccion-movil-casos-2026
          fetch-depth: 0

      - name: Normalizar casos y vista movil
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Normalizar los diez CASO CHIHUAHUA:
          # todo el relato debe permanecer dentro del mismo recuadro hasta preguntas.
          pat=re.compile(
              r'<div class="marker case">(?P<body>.*?)<div class="marker questions">',
              re.S
          )
          found=0
          def repl(m):
              nonlocal_placeholder = None
              body=m.group('body')
              # Quitar cierres prematuros y párrafos de continuación heredados
              body=re.sub(r'</div>\s*', '', body)
              body=re.sub(r'<p(?:\s+[^>]*)?>\s*', '', body)
              body=re.sub(r'\s*</p>\s*', '\n', body)
              body=body.strip()
              return '<div class="marker case">\n            '+body.replace('\n','\n            ')+'\n          </div>\n          <div class="marker questions">'
          s2,n=pat.subn(repl,s)
          s=s2
          found=n
          if found != 10:
              raise SystemExit(f'Se esperaban 10 casos; normalizados: {found}')

          # 2) El cuerpo de los casos no debe heredarse en negritas completas.
          old='''      .marker.case {\n        border: 2px solid #25a994;\n        background: #edf9f7;\n        color: #0a5b50;\n      }'''
          new='''      .marker.case {\n        border: 2px solid #25a994;\n        background: #edf9f7;\n        color: #0a5b50;\n        font-weight: 450;\n        line-height: 1.65;\n      }\n      .marker.case::first-line {\n        font-weight: 850;\n      }'''
          if old not in s:
              raise SystemExit('No se encontró bloque CSS de .marker.case')
          s=s.replace(old,new,1)

          # 3) Encabezado móvil más compacto y anclas que no queden ocultas.
          old_mobile='''        .chapter-head {\n          padding: 14px 12px 14px 68px;\n        }\n        .chapter-no {\n          display: none;\n        }\n        .chapter-head h2 {\n          font-size: 20px;\n        }\n        .chapter-head span {\n          font-size: 10px;\n        }'''
          new_mobile='''        .chapter-head {\n          top: 0;\n          min-height: 64px;\n          padding: 9px 10px 9px 62px;\n          gap: 8px;\n        }\n        .chapter-no {\n          display: none;\n        }\n        .chapter-head h2 {\n          font-size: 17px;\n          line-height: 1.12;\n          max-width: calc(100vw - 126px);\n        }\n        .chapter-head span {\n          display: none;\n        }\n        .complete-btn {\n          width: 36px;\n          height: 36px;\n          flex: 0 0 36px;\n        }\n        .menu {\n          left: 10px;\n          top: 10px;\n          width: 42px;\n          height: 42px;\n        }\n        .chapter,\n        .content,\n        .chapter-body h3,\n        .chapter-body h4 {\n          scroll-margin-top: 76px;\n        }'''
          if old_mobile not in s:
              raise SystemExit('No se encontró bloque móvil esperado')
          s=s.replace(old_mobile,new_mobile,1)

          # 4) Validaciones de regresión.
          if re.search(r'</div>\s*<p>\s*(?:administración del negocio|2023 un periodo)',s,re.S|re.I):
              raise SystemExit('Persisten cortes de caso detectados')
          for m in re.finditer(r'<div class="marker case">(.*?)<div class="marker questions">',s,re.S):
              chunk=m.group(1)
              if '<p' in chunk or '</p>' in chunk:
                  raise SystemExit('Persisten párrafos externos/intermedios en un caso')
          if s.count('<div class="marker case">') != 10:
              raise SystemExit('Cantidad de casos alterada')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'font-weight: 450' index.html
          grep -Fq 'scroll-margin-top: 76px' index.html

      - name: Guardar correcciones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: corregir casos y encabezado movil'
          git push origin HEAD:correccion-movil-casos-2026
