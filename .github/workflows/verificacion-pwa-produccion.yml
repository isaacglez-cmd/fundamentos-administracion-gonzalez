name: Verificacion PWA y Produccion

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validar-fuente:
    name: Validar archivos del cambio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la revision evaluada
        uses: actions/checkout@v4

      - name: Verificar contenido interactivo y cierre editorial
        run: |
          set -euo pipefail
          test -s index.html
          grep -Fq "Edición Digital Interactiva 2026" index.html
          grep -Fq "url: location.href" index.html
          grep -Fq "The contingency approach argues that the best management style depends on the situation." index.html
          grep -Fq 'id="cuaderno-cap10"' index.html
          grep -Fq 'id="integradoras"' index.html
          grep -Fq 'localStorage.setItem("fadm_"' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js")' index.html
          grep -Fq "Figura 4.1 · Criterios SMART de un objetivo." index.html
          grep -Fq "Figura 8.1 · Etapas de desarrollo de un equipo según Tuckman." index.html
          grep -Fq "<h3>7.1 Liderazgo vs. administración</h3>" index.html
          ! grep -Fq "<p>sobre el desempeño, más allá de las condiciones físicas.</p>" index.html
          ! grep -Fq "<p>organización</p>" index.html
          ! grep -Fq "<p>tiempo disponibles</p>" index.html
          ! grep -Fq "<p>proyecto simultáneamente</p>" index.html
          ! grep -Fq "<p>responsabilidad compartida</p>" index.html
          ! grep -Fq "<p>estratégicos</p>" index.html
          ! grep -Eiq 'UACH|Universidad Autónoma de Chihuahua|Facultad de Economía Internacional' index.html manifest.webmanifest
          grep -Fq "Edición independiente 2026" index.html
          grep -Fq "Material académico independiente" index.html

      - name: Verificar datos interactivos
        run: |
          python - <<'PY'
          import json, re
          s=open('index.html',encoding='utf-8').read()
          q=re.search(r'<script id="quizData" type="application/json">(.*?)</script>',s,re.S)
          f=re.search(r'<script id="flashData" type="application/json">(.*?)</script>',s,re.S)
          assert len(json.loads(q.group(1))) == 30
          assert len(json.loads(f.group(1))) == 10
          assert all(f'id="cuaderno-cap{i}"' in s for i in range(1,11))
          print('10 capítulos · 30 quizzes · 10 flashcards · cuadernos completos')
          PY

      - name: Verificar manifiesto PWA local
        run: |
          set -euo pipefail
          test -s manifest.webmanifest
          grep -Fq '"display": "standalone"' manifest.webmanifest
          grep -Fq '"icon-192.png"' manifest.webmanifest
          grep -Fq '"icon-512.png"' manifest.webmanifest

      - name: Verificar service worker local
        run: |
          set -euo pipefail
          test -s sw.js
          grep -Fq 'const CACHE = "fundamentos-adm-2026-v3"' sw.js
          grep -Fq '"./manifest.webmanifest"' sw.js
          grep -Fq '"./icon-192.png"' sw.js
          grep -Fq '"./icon-512.png"' sw.js

      - name: Verificar iconos PWA locales
        run: |
          set -euo pipefail
          for f in icon-192.png icon-512.png; do
            test -s "$f"
            file "$f" | grep -Fq "PNG image data"
          done

  verificar-produccion:
    name: Health check de produccion
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar portada HTTP 200 y loader de produccion
        run: |
          set -euo pipefail
          BASE="https://fundamentos-administracion-gonzalez-five.vercel.app"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$BASE/" -o /tmp/index.html
          grep -Fq "Fundamentos de la Administración" /tmp/index.html
          grep -Fq "raw.githubusercontent.com/isaacglez-cmd/fundamentos-administracion-gonzalez/main/index.html" /tmp/index.html

      - name: Verificar contenido final servido desde main
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/isaacglez-cmd/fundamentos-administracion-gonzalez/main/index.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$RAW" -o /tmp/full-index.html
          grep -Fq "url: location.href" /tmp/full-index.html
          grep -Fq "Edición Digital Interactiva 2026" /tmp/full-index.html
          grep -Fq 'id="cuaderno-cap10"' /tmp/full-index.html
          grep -Fq 'id="integradoras"' /tmp/full-index.html
          grep -Fq "Figura 4.1 · Criterios SMART de un objetivo." /tmp/full-index.html
          grep -Fq "Figura 8.1 · Etapas de desarrollo de un equipo según Tuckman." /tmp/full-index.html
          ! grep -Eiq 'UACH|Universidad Autónoma de Chihuahua|Facultad de Economía Internacional' /tmp/full-index.html
          grep -Fq "Edición independiente 2026" /tmp/full-index.html

      - name: Verificar manifiesto PWA de produccion
        run: |
          set -euo pipefail
          BASE="https://fundamentos-administracion-gonzalez-five.vercel.app"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$BASE/manifest.webmanifest" -o /tmp/manifest.webmanifest
          grep -Fq '"display": "standalone"' /tmp/manifest.webmanifest
          grep -Fq '"icon-192.png"' /tmp/manifest.webmanifest
          grep -Fq '"icon-512.png"' /tmp/manifest.webmanifest

      - name: Verificar service worker de produccion
        run: |
          set -euo pipefail
          BASE="https://fundamentos-administracion-gonzalez-five.vercel.app"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$BASE/sw.js" -o /tmp/sw.js
          grep -Fq "fundamentos-adm-2026-v3" /tmp/sw.js
          grep -Fq "./manifest.webmanifest" /tmp/sw.js

      - name: Verificar iconos PWA de produccion
        run: |
          set -euo pipefail
          BASE="https://fundamentos-administracion-gonzalez-five.vercel.app"
          for f in icon-192.png icon-512.png; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$BASE/$f" -o "/tmp/$f"
            test -s "/tmp/$f"
            file "/tmp/$f" | grep -Fq "PNG image data"
          done

      - name: Resumen
        run: echo "Produccion HTTP, PWA, contenido interactivo y cierre editorial verificados correctamente."
