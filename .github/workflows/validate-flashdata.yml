name: Validar flashData 2026

on:
  push:
    branches:
      - cierre-calidad-2026

permissions:
  contents: write

jobs:
  validate-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cierre-calidad-2026
      - name: Reparar cierre JSON y validar datos
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=r'depends on the situation.\"}'
          new=r'depends on the situation.\""}'
          if old not in s:
              raise SystemExit('No se encontró el cierre JSON esperado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          for sid in ('quizData','flashData'):
              m=re.search(r'<script id="'+sid+r'" type="application/json">(.*?)</script>',s,re.S)
              if not m:
                  raise SystemExit('No se encontró '+sid)
              data=json.loads(m.group(1))
              print(sid, 'OK', len(data))
          flash=json.loads(re.search(r'<script id="flashData" type="application/json">(.*?)</script>',s,re.S).group(1))
          ch2=next(x for x in flash if x['ch']==2)
          assert 'depends on the situation.' in ch2['es']
          assert "url:location.href" in s
          assert "href='https://www.economia.unam.mx/ ('" not in s
          assert "href='https://www.rebiun.org/ ('" not in s
          assert "href='https://www.gob.mx/se ('" not in s
          print('Validación integral OK')
          PY
      - name: Commit validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-flashdata.yml
          git add -- index.html
          git commit -m "fix: validar datos de flashcards"
          git push origin HEAD:cierre-calidad-2026
